<!doctype html>
<html>
	<head lang="en">
		<title>WoW Slot</title>
		<meta charset="utf-8" />
		<style>
			body {
				margin: 0;
				padding: 8px 12px;
				font: 12px -apple-system, BlinkMacSystemFont, sans-serif;
				color: #d8d8d8;
				background: #2d2d2d;
			}
			label {
				display: flex;
				align-items: center;
				gap: 8px;
				margin: 6px 0;
			}
			label span {
				width: 60px;
				text-align: right;
				color: #969696;
			}
			select {
				flex: 1;
				padding: 3px 4px;
				color: #d8d8d8;
				background: #3d3d3d;
				border: 1px solid #555;
				border-radius: 3px;
			}
		</style>
		<script src="inspector.js"></script>
	</head>
	<body>
		<label><span>Bar</span><select id="bar"></select></label>
		<label><span>Button</span><select id="button"></select></label>
	</body>
</html>
