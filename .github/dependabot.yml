version: 2
updates:
  - package-ecosystem: npm
    directory: /plugin
    schedule:
      interval: weekly
    groups:
      # One PR for all dev tooling; runtime dependencies (@elgato/streamdeck, ws) get their own.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (native port) drops the JS compiler API that @rollup/plugin-typescript
      # needs. Lift this once the plugin supports TS 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
